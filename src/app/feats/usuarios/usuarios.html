@for (usuario of usuarioService.usuarios(); track usuario.id) {

    <div class="card">
        <img [src]="usuario.img" class="card-img-top" alt="Foto do usuário">

        <div class="card-body">
            <h2>Id: {{ usuario.id }}</h2>
            <p>Nome: {{ usuario.nome }}</p>
            <p>Idade: {{ usuario.idade }}</p>
        </div>
    </div>

}
